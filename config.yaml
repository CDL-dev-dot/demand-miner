# ---- App Store storefront used by stages 1 and 3 ----
country: us

# ---- Stage 1: collect low-rated App Store reviews ----
# These seed terms are the main steering wheel. Use concrete app categories or
# jobs-to-be-done rather than broad words such as "productivity".
app_search_terms:
  - subscription tracker
  - pet medication
  - ADHD planner
  - family organizer
  - home inventory
  - diabetes tracker

app_search_limit: 25
apps_per_search_term: 3
minimum_app_rating_count: 100
review_sort: mostrecent
review_pages_per_app: 2
review_ratings: [1, 2, 3]
max_reviews_per_app: 20
search_request_delay_seconds: 3.1
review_request_delay_seconds: 0.25

# ---- Stage 2: extraction ----
extract_batch_size: 8

# ---- Stage 3: validation ----
keywords_per_cluster: 3
new_app_months: 18
swarm_threshold: 3
